# Flutter Launcher Icons configuration - place this at the root level
flutter_launcher_icons:
  image_path: "assets/md.jpg"
  android: "launcher_icon"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/md.jpg"
    background_color: "#2E7D32"  # Replace with actual color
    theme_color: "#2E7D32"       # Replace with actual color
  windows:
    generate: true
    image_path: "assets/md.jpg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/md.jpg"